<svg width="1280" height="320" viewBox="0 0 1280 320" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#09090b"/>
      <stop offset="55%" stop-color="#0f0f13"/>
      <stop offset="100%" stop-color="#13131a"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M 36 0 L 0 0 0 36" fill="none" stroke="#27272a" stroke-width="0.6" opacity="0.35"/>
    </pattern>
  </defs>

  <rect width="1280" height="320" fill="url(#bg)"/>
  <rect width="1280" height="320" fill="url(#grid)"/>
  <ellipse cx="1040" cy="60" rx="380" ry="220" fill="url(#glow)"/>

  <!-- code bracket mark -->
  <g transform="translate(96,110)" fill="none" stroke="#a5b4fc" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
    <path d="M28 0 L2 50 L28 100"/>
    <path d="M78 0 L104 50 L78 100" stroke="#6366f1"/>
    <line x1="60" y1="-8" x2="46" y2="108" stroke="#e0e7ff" stroke-width="5"/>
  </g>

  <!-- title -->
  <text x="250" y="150" font-family="Menlo, Consolas, monospace" font-size="58" font-weight="700" fill="#fafafa">CodeSense<tspan fill="#818cf8"> AI</tspan></text>
  <text x="252" y="188" font-family="Menlo, Consolas, monospace" font-size="19" fill="#a1a1aa" letter-spacing="0.5">Deterministic static analysis, fused with streaming multi-LLM reasoning.</text>

  <!-- status chips -->
  <g font-family="Menlo, Consolas, monospace" font-size="13" fill="#71717a">
    <rect x="252" y="216" width="150" height="30" rx="15" fill="#18181b" stroke="#27272a"/>
    <circle cx="270" cy="231" r="4" fill="#34d399"/>
    <text x="282" y="235" fill="#d4d4d8">AST Parser</text>

    <rect x="414" y="216" width="176" height="30" rx="15" fill="#18181b" stroke="#27272a"/>
    <circle cx="432" cy="231" r="4" fill="#34d399"/>
    <text x="444" y="235" fill="#d4d4d8">Security Scanner</text>

    <rect x="602" y="216" width="196" height="30" rx="15" fill="#18181b" stroke="#27272a"/>
    <circle cx="620" cy="231" r="4" fill="#818cf8"/>
    <text x="632" y="235" fill="#d4d4d8">Multi-LLM Router</text>
  </g>

  <rect x="96" y="272" width="1088" height="1.5" fill="url(#accent)" opacity="0.4"/>
</svg>
