# A generic, single-database configuration for Alembic relational tracking engines.

[alembic]
# Path to migration script environment trees
script_location = alembic

# Template used when generating migration files
file_template = %%(year)d_%%(month).2d_%%(day).2d_%%(hour).2d%%(minute).2d-%%(rev)s_%%(slug)s

# Prefix used for system timezone definitions
timezone = UTC

# Local database file path configuration mapper target (points directly to sqlite pool)
sqlalchemy.url = sqlite:///./codesense.db

# Logging Configuration Section
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = INFO
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stdout,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(asctime)s %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S